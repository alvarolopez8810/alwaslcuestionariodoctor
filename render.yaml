# Render Blueprint - NOT applied automatically. Review before creating the service.
# Secrets are declared with sync: false so they are entered in the Render dashboard,
# never stored in this file.
services:
  - type: web
    name: alwasl-process-audit
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUDIT_APP_PASSWORD
        sync: false
      - key: AUDIT_STORAGE_BACKEND
        value: sql
      - key: AUDIT_DATABASE_URL
        fromDatabase:
          name: alwasl-process-audit-db
          property: connectionString
      - key: AUDIT_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: alwasl-process-audit-db
    plan: basic-256mb
    ipAllowList: []   # only Render services can connect
