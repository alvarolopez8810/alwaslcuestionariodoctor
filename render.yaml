# Render Blueprint - NOT applied automatically. Review before creating the service.
# Secrets use sync: false so they are entered in the Render dashboard, never stored here.
services:
  - type: web
    name: alwasl-daily-report-discovery
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUDIT_APP_PASSWORD
        sync: false
      - key: AUDIT_STORAGE_BACKEND
        value: sheets
      - key: AUDIT_SHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_JSON
        sync: false
